<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ec">
<meta name="description" content="Электронная визитка Натальи Старковой">
<title>Наталья Старкова — контакты</title>
<style>
:root{--bg:#f6f2eb;--card:#fffdf9;--ink:#24211e;--muted:#77716a;--gold:#bd8a24;--line:#eadfcd}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#fffdf9 0,#f6f2eb 55%,#eee7dc 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:560px;margin:auto;padding:18px 16px 34px}
.hero,.item,.actions{background:rgba(255,253,249,.94);border:1px solid rgba(220,207,187,.55);box-shadow:0 10px 35px rgba(70,55,35,.08);border-radius:24px}
.hero{padding:34px 22px 28px;text-align:center;position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;width:150px;height:150px;border:1px solid #e5cf9e;border-radius:50%;opacity:.5}
.hero:before{left:-100px;top:-90px}.hero:after{right:-100px;bottom:-90px}
.avatar{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#d9b46a,#a87416);color:white;font:600 34px Georgia,serif;box-shadow:0 4px 18px rgba(154,108,25,.22);border:4px solid #fff}
h1{font:400 42px/1.05 Georgia,"Times New Roman",serif;margin:0 0 16px}
.rule{width:100px;height:1px;background:var(--gold);margin:0 auto 15px;position:relative}.rule:after{content:"";width:9px;height:9px;background:var(--gold);border-radius:50%;position:absolute;left:calc(50% - 4px);top:-4px}
.sub{color:var(--muted);font-size:16px;margin:0}
.list{display:grid;gap:10px;margin-top:14px}.item{display:flex;align-items:center;gap:14px;padding:17px 18px;text-decoration:none;color:inherit}
.icon{width:44px;height:44px;border-radius:14px;background:#f5ecdb;display:grid;place-items:center;color:var(--gold);font-size:22px;flex:0 0 auto}
.label{font-size:11px;letter-spacing:.12em;color:#938b81;text-transform:uppercase;margin-bottom:4px}.value{font-size:17px;word-break:break-word}.arrow{margin-left:auto;color:var(--gold);font-size:24px}
.actions{padding:12px;margin-top:14px;display:grid;gap:10px;background:transparent;border:0;box-shadow:none}
.btn{border-radius:15px;padding:17px 16px;text-align:center;text-decoration:none;font-size:17px;font-weight:600;border:1px solid var(--gold);cursor:pointer}
.primary{background:linear-gradient(135deg,#c9952d,#b47d19);color:#fff;border-color:#b47d19;box-shadow:0 7px 18px rgba(180,125,25,.2)}
.secondary{background:#fffdf9;color:#b17b1a}
.note{text-align:center;color:var(--muted);font-size:14px;margin:9px 0 0}
footer{text-align:center;color:#9b9389;font-size:13px;margin-top:22px}
@media(max-width:390px){h1{font-size:35px}.wrap{padding:12px 12px 28px}.value{font-size:16px}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
  <div class="avatar" aria-label="Наталья Старкова">НС</div>
  <h1>Наталья Старкова</h1>
  <div class="rule"></div>
  <p class="sub">Буду рада знакомству и сотрудничеству</p>
</section>

<section class="list" aria-label="Контактные данные">
  <a class="item" href="tel:+79673377718">
    <span class="icon">⌕</span><span><div class="label">Телефон</div><div class="value">+7 967 337-77-18</div></span><span class="arrow">›</span>
  </a>
  <a class="item" href="mailto:n.generalova@h-t-l.ru">
    <span class="icon">✉</span><span><div class="label">Email</div><div class="value">n.generalova@h-t-l.ru</div></span><span class="arrow">›</span>
  </a>
  <a class="item" href="https://h-t-l.one/" target="_blank" rel="noopener">
    <span class="icon">◎</span><span><div class="label">Сайт</div><div class="value">h-t-l.one</div></span><span class="arrow">›</span>
  </a>
</section>

<section class="actions">
  <a class="btn primary" href="contact.vcf" download="Natalia_Starkova.vcf">＋&nbsp; Добавить контакт</a>
  <a class="btn secondary" href="https://h-t-l.one/" target="_blank" rel="noopener">◎&nbsp; Открыть сайт h-t-l.one</a>
  <p class="note">Сохраните мои контакты в один клик</p>
</section>
<footer>Наталья Старкова · электронная визитка</footer>
</main>
</body>
</html>
